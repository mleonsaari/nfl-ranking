* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {

<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const f2 = v => (Math.round(v * 100) / 100).toFixed(2);
  const fnum = (v, d) => { const s = v.toFixed(d); return v < 0 ? '−' + s.slice(1) : s; };
  const weekName = l => /^Wk\d+$/.test(l) ? 'Week ' + l.slice(2)
      : ({WC: 'Wild Card round', DIV: 'Divisional round', CON: 'Conference finals', SB: 'Super Bowl'}[l] || l);
  const short = l => /^Wk\d+$/.test(l) ? l.slice(2) : l;
  const chg = c => c > 0 ? `<span class="up" title="Up ${c}">▲ ${c}</span>`
                : c < 0 ? `<span class="down" title="Down ${-c}">▼ ${-c}</span>`
                : '<span class="flat" title="No change">–</span>';

  document.title = D.title;
  $('#title').textContent = D.title;
  $('#sub').textContent = `Standings after ${weekName(D.after)}. Updated ${D.updated}.`;
  $('#foot').textContent = 'Scores from the nflverse project. NFL.com rankings from the weekly NFL.com Power Rankings article.';

  // ------------------------------------------------------------ sortable table
  function table(cols, rows, opt) {
    opt = opt || {};
    const box = document.createElement('div');
    box.className = 'scroll';
    let key = opt.sort || null, dir = opt.dir || 1;
    function render() {
      let rs = rows.slice();
      if (key !== null) {
        const c = cols.find(c => c.key === key);
        const val = c.sortVal || (r => r[c.key]);
        rs.sort((a, b) => {
          const x = val(a), y = val(b);
          if (typeof x === 'string') return dir * x.localeCompare(y);
          return dir * (x - y) || (a._i - b._i);
        });
      }
      let h = '<table><thead><tr>';
      cols.forEach(c => {
        const sortable = c.sortable !== false;
        const on = key === c.key;
        const aria = sortable ? ` aria-sort="${on ? (dir > 0 ? 'ascending' : 'descending') : 'none'}"` : '';
        h += `<th scope="col" class="${c.cls || ''} ${c.l ? 'l' : ''} ${sortable ? 'sortable' : ''}"${aria}`
           + (sortable ? ` tabindex="0" data-k="${c.key}"` : '') + (c.title ? ` title="${esc(c.title)}"` : '') + '>'
           + esc(c.label) + (sortable ? `<span class="arrow">${on ? (dir > 0 ? '↑' : '↓') : ''}</span>` : '') + '</th>';
      });
      h += '</tr></thead><tbody>';
      rs.forEach(r => {
        h += `<tr class="${opt.rowCls ? opt.rowCls(r) : ''}">`;
        cols.forEach(c => {
          const v = c.fmt ? c.fmt(r) : esc(r[c.key]);
          const cc = (c.cls || '') + ' ' + (c.l ? 'l ' : '') + (c.tdCls ? c.tdCls(r) : '');
          h += `<td class="${cc}">${v}</td>`;
        });
        h += '</tr>';
      });
      box.innerHTML = h + '</tbody></table>';
      box.querySelectorAll('th[data-k]').forEach(th => {
        const go = () => {
          const k = th.dataset.k;
          const c = cols.find(c => c.key === k);
          if (key === k) dir = -dir; else { key = k; dir = c.firstDir || 1; }
          render();
          const again = box.querySelector(`th[data-k="${k}"]`);
          if (again) again.focus();
        };
        th.addEventListener('click', go);
        th.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
    }
    rows.forEach((r, i) => r._i = i);
    render();
    return box;
  }
  const rankCol = (label) => ({key: 'rank', label: label || 'Rank', cls: 'c-rank stick', tdCls: () => 'rk', firstDir: 1});
  const teamCol = (two) => ({key: 'name', label: 'Team', l: true, cls: two ? 'stick stick2' : 'stick', tdCls: () => 'team'});

  // ------------------------------------------------------------ sections
  const sections = [];
  function section(id, tab, build) { sections.push({id, tab, build}); }
  const T = D.teams;
  const lastIdx = D.rounds.length - 1;

  section('ranking', 'Ranking', el => {
    el.innerHTML = `<h2>Ranking after ${esc(weekName(D.after))}</h2>
      <p class="lede">Total points decide the order. Tap a column heading to sort.</p>`;
    const rows = T.map(t => ({...t, wk: t.points[lastIdx], kind: t.kinds[lastIdx]}));
    el.append(table([
      rankCol(),
      {...teamCol(true), fmt: r => `${esc(r.name)}<span class="sub">${esc(r.record)}</span>`},
      {key: 'change', label: 'Change', fmt: r => chg(r.change), firstDir: -1},
      {key: 'record', label: 'Record', cls: 'hide-sm', sortVal: r => {
          const m = r.record.match(/^(\d+)-(\d+)(?:-(\d+))?/); return m ? -(+m[1] + 0.5 * (+m[3] || 0)) / Math.max(1, +m[1] + +m[2] + (+m[3] || 0)) : 0; }},
      {key: 'wk', label: `${D.after} pts`, firstDir: -1, title: `Points earned in ${weekName(D.after)}`,
       fmt: r => `<span class="k-${r.kind}"${r.kind === 'BYE' ? ' title="Bye week: average of the team\'s game points"' : ''}>${fnum(r.wk, 2)}</span>`},
      {key: 'start', label: 'Start points', cls: 'hide-sm', fmt: r => f2(r.start), firstDir: -1},
      {key: 'total', label: 'Total', fmt: r => `<strong>${fnum(r.total, 2)}</strong>`, firstDir: -1},
      {key: 'rp', label: 'Ranking points', cls: 'hide-sm', fmt: r => r.rp.toFixed(1), firstDir: -1,
       title: 'Worth this much to a team that beats them next week'},
    ], rows, {sort: 'rank'}));
    el.insertAdjacentHTML('beforeend', `<div class="legend">
      <span><span class="k-BYE">Green</span>: bye week, scored as the team's average game points</span>
      <span><span class="k-T">Red</span>: tie game</span><span><span class="k-CXL">Orange</span>: cancelled game</span></div>`);
  });

  if (D.upcoming) section('games', `${D.upcoming.label} games`, el => {
    const U = D.upcoming;
    el.innerHTML = `<h2>${esc(weekName(U.label))} games</h2>
      <p class="lede">Rated with the ranking after ${esc(weekName(D.after))}. Game score is the teams' average rank plus the gap between them, so lower means a better matchup. Kickoff times are US Eastern.</p>`;
    if (!U.games.length) { el.insertAdjacentHTML('beforeend', '<p class="lede">The matchups for this round are not set yet.</p>'); return; }
    let slot = null, box = null;
    U.games.forEach(g => {
      const k = g.date + ' ' + g.time;
      if (k !== slot) {
        slot = k;
        const d = new Date(g.date + 'T12:00:00');
        const ds = isNaN(d) ? g.date : d.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
        box = document.createElement('div'); box.className = 'slot';
        box.innerHTML = `<h3>${esc(ds)}, ${esc(g.time)} ET</h3>`;
        el.append(box);
      }
      const tag = g.tier === 1 ? '<span class="tag">Top 3 game</span>' : g.tier === 2 ? '<span class="tag">Top 4–6 game</span>' : '';
      box.insertAdjacentHTML('beforeend', `<div class="game ${g.tier ? 't' + g.tier : ''}">
        <div class="gr" title="Game rank this week">${g.qrank}<small>of ${U.games.length}</small></div>
        <div class="match">${esc(g.away)} <span class="r">(${g.awayRank})</span> <span class="at">at</span> ${esc(g.home)} <span class="r">(${g.homeRank})</span>
          <div class="meta">${tag}${tag ? ' ' : ''}${g.result ? 'Final ' + esc(g.result) : ''}</div></div>
        <div class="score">${g.score.toFixed(1)}<small>score</small></div></div>`);
    });
    if (U.byes.length) el.insertAdjacentHTML('beforeend', `<p class="note">On bye: ${U.byes.map(esc).join(', ')}.</p>`);
  });

  if (D.nflcom) section('nflcom', 'vs NFL.com', el => {
    const N = D.nflcom;
    el.innerHTML = '<h2>Compared with NFL.com</h2>';
    if (N.latest) {
      const L = N.latest;
      el.insertAdjacentHTML('beforeend', `<p class="lede">My ranking after ${esc(weekName(L.my))} against the NFL.com Power Rankings published for ${esc(L.nfl)}. Difference is the NFL.com rank minus mine, so a positive number means NFL.com has the team lower.</p>`);
      const cols = document.createElement('div'); cols.className = 'cols'; el.append(cols);
      const a = document.createElement('div'); cols.append(a);
      a.append(table([
        rankCol('Mine'), teamCol(true),
        {key: 'change', label: 'Change', fmt: r => chg(r.change), firstDir: -1, cls: 'hide-sm'},
        {key: 'nfl', label: 'NFL.com'},
        {key: 'diff', label: 'Difference', sortVal: r => Math.abs(r.diff),
         fmt: r => (r.diff > 0 ? '+' : r.diff < 0 ? '−' : '') + Math.abs(r.diff),
         tdCls: r => Math.abs(r.diff) <= 2 ? 'd' + Math.abs(r.diff) : ''},
      ], L.rows.slice(), {sort: 'rank'}));
      a.insertAdjacentHTML('beforeend', '<p class="note">Shading marks teams 0, 1 or 2 places apart, darkest for an exact match.</p>');
      const b = document.createElement('div'); cols.append(b);
      b.insertAdjacentHTML('beforeend', '<h3 style="margin-top:0">Week by week</h3>');
      b.append(table([
        {key: 'my', label: 'Mine', l: true, sortable: false, fmt: r => esc(r.my)},
        {key: 'nfl', label: 'NFL.com', l: true, sortable: false},
        {key: 'exact', label: 'Exact', sortable: false}, {key: 'one', label: '±1', sortable: false},
        {key: 'two', label: '±2', sortable: false},
        {key: 'within', label: 'Within 2', sortable: false, fmt: r => `<strong>${r.within}</strong>`},
        {key: 'avg', label: 'Avg gap', sortable: false, fmt: r => r.avg.toFixed(2)},
      ], N.tally.slice()));
    }
    N.notes.forEach(n => el.insertAdjacentHTML('beforeend', `<p class="note">${esc(n)}</p>`));
  });

  section('points', 'Weekly points', el => {
    el.innerHTML = `<h2>Weekly points</h2><p class="lede">Points each team earned round by round. Start points are not included here.</p>`;
    const cols = [rankCol(), teamCol(true)];
    D.rounds.forEach((l, i) => cols.push({key: 'w' + i, label: short(l), firstDir: -1, title: weekName(l),
      fmt: r => `<span class="k-${r.kinds[i]}">${fnum(r.points[i], 2)}</span>`}));
    cols.push({key: 'gamePts', label: 'Season', firstDir: -1, fmt: r => `<strong>${fnum(r.gamePts, 2)}</strong>`});
    const rows = T.map(t => { const o = {...t}; t.points.forEach((p, i) => o['w' + i] = p); return o; });
    el.append(table(cols, rows, {sort: 'rank'}));
    el.insertAdjacentHTML('beforeend', `<div class="legend">
      <span><span class="k-BYE">Green</span>: bye week</span><span><span class="k-T">Red</span>: tie game</span>
      <span><span class="k-CXL">Orange</span>: cancelled game</span></div>`);
  });

  section('history', 'Rank history', el => {
    el.innerHTML = `<h2>Rank history</h2><p class="lede">Every team's rank from the preseason onwards. Pick a team to follow, and another to compare.</p>`;
    el.append(chart());
    el.insertAdjacentHTML('beforeend', '<h3>All teams</h3>');
    const cols = [teamCol(false), {key: 'r0', label: 'Pre', title: 'Preseason rank'}];
    D.rounds.forEach((l, i) => cols.push({key: 'r' + (i + 1), label: short(l), title: weekName(l)}));
    const rows = T.map(t => { const o = {...t}; t.ranks.forEach((r, i) => o['r' + i] = r); return o; });
    el.append(table(cols, rows, {sort: 'r' + (D.rounds.length)}));
  });

  section('totals', 'Total points', el => {
    el.innerHTML = `<h2>Total points</h2><p class="lede">Each team's total after every round, including the start points that fade out by week 9.</p>`;
    const cols = [rankCol(), teamCol(true)];
    D.rounds.forEach((l, i) => cols.push({key: 't' + i, label: short(l), firstDir: -1, title: weekName(l),
      fmt: r => fnum(r.totals[i], 2)}));
    const rows = T.map(t => { const o = {...t}; t.totals.forEach((p, i) => o['t' + i] = p); return o; });
    el.append(table(cols, rows, {sort: 'rank'}));
  });

  section('about', 'How it works', el => {
    el.innerHTML = `<div class="about"><h2>How the ranking works</h2>
      <p>Every team starts the season with points from a preseason ranking: 80 for the top team, then two fewer per place down to 18. Those start points fade out evenly over weeks 2 to 9, so from week 9 on only results count.</p>
      <p>Each week a team's <strong>ranking points</strong> are 41 minus its rank, so the top team is worth 40 and the last one 9.</p>
      <ul>
        <li><strong>A win</strong> earns a share of the opponent's ranking points: half in weeks 1–2, three quarters in week 3 and all of them from week 4. Beating a strong team pays more.</li>
        <li><strong>A loss</strong> costs a share of the opponent's rank number: a quarter in weeks 1–2, 0.375 in week 3 and half from week 4. Losing to a weak team costs more.</li>
        <li><strong>A tie</strong> gives both teams half of the opponent's ranking points.</li>
        <li><strong>A bye week</strong> scores the team's average points per game so far.</li>
        <li><strong>A cancelled game</strong> is scored from both teams' win percentages as a probability-weighted result.</li>
        <li><strong>Teams level on total points</strong> share the rank and split the ranking points of the places they occupy.</li>
        <li><strong>In the playoffs</strong> winners get a bonus on top (+5, +10, +30, +40 by round), the top seeds on bye in the Wild Card round get the best Wild Card winner's points, and eliminated teams take the round's biggest loss penalty.</li>
      </ul></div>`;
  });

  // ------------------------------------------------------------ chart
  function chart() {
    const wrap = document.createElement('div'); wrap.className = 'chartbox';
    const opts = T.slice().sort((a, b) => a.name.localeCompare(b.name))
      .map(t => `<option value="${t.code}">${esc(t.name)}</option>`).join('');
    wrap.innerHTML = `<div class="pickers">
      <label><span class="swatch" style="background:var(--s1)"></span>Team <select id="pa">${opts}</select></label>
      <label><span class="swatch" style="background:var(--s2)"></span>Compare with <select id="pb"><option value="">Nobody</option>${opts}</select></label></div>
      <div class="plot"></div><div class="tip" role="status"></div>`;
    const pa = $('#pa', wrap), pb = $('#pb', wrap), plot = $('.plot', wrap), tip = $('.tip', wrap);
    pa.value = T[0].code;
    const labels = ['Pre'].concat(D.rounds);
    const n = labels.length;
    let W = 760, H = 400, lastW = 0; const m = {l: 30, r: 92, t: 10, b: 26};
    const x = i => m.l + (n === 1 ? 0 : i * (W - m.l - m.r) / (n - 1));
    const y = r => m.t + (r - 1) * (H - m.t - m.b) / 31;
    const path = t => t.ranks.map((r, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(r).toFixed(1)).join('');
    const byCode = c => T.find(t => t.code === c);
    let picked = [];
    function draw() {
      const cw = Math.round(plot.clientWidth || 0);
      W = Math.max(300, cw || 760); H = W < 560 ? 330 : 400; m.r = W < 560 ? 64 : 92; lastW = cw;
      picked = [byCode(pa.value), pb.value && pb.value !== pa.value ? byCode(pb.value) : null]
        .map((t, k) => t && {t, color: k ? 'var(--s2)' : 'var(--s1)'}).filter(Boolean);
      let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rank by week for ${esc(picked.map(p => p.t.name).join(' and '))}">`;
      [1, 8, 16, 24, 32].forEach(r => s += `<line class="grid" x1="${m.l}" x2="${W - m.r}" y1="${y(r)}" y2="${y(r)}"/><text class="axis" x="${m.l - 8}" y="${y(r) + 4}" text-anchor="end">${r}</text>`);
      const every = n > (W < 560 ? 8 : 14) ? 2 : 1;
      labels.forEach((l, i) => { if (i % every === 0 || i === n - 1) s += `<text class="axis" x="${x(i)}" y="${H - 6}" text-anchor="middle">${esc(short(l))}</text>`; });
      T.forEach(t => s += `<path class="bg-line" d="${path(t)}"/>`);
      const ends = picked.map(p => ({p, yy: y(p.t.ranks[n - 1])}));
      if (ends.length === 2 && Math.abs(ends[0].yy - ends[1].yy) < 15) {
        const mid = (ends[0].yy + ends[1].yy) / 2, up = ends[0].yy <= ends[1].yy ? 0 : 1;
        ends[up].yy = mid - 8; ends[1 - up].yy = mid + 8;
      }
      picked.forEach(p => s += `<path class="hl" stroke="${p.color}" d="${path(p.t)}"/>`);
      picked.forEach((p, k) => {
        const r = p.t.ranks[n - 1];
        s += `<circle cx="${x(n - 1)}" cy="${y(r)}" r="5" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`;
        s += `<text class="endlbl" x="${x(n - 1) + 10}" y="${ends[k].yy + 4}">${esc(p.t.code === 'LA' ? 'LAR' : p.t.code)} #${r}</text>`;
      });
      s += `<line class="xhair" id="xh" y1="${m.t}" y2="${H - m.b}" style="display:none"/><g id="hd"></g>`;
      s += `<rect x="${m.l - 10}" y="0" width="${W - m.l - m.r + 20}" height="${H}" fill="transparent" id="hit"/></svg>`;
      plot.innerHTML = s;
      const svg = $('svg', plot), xh = $('#xh', svg), hd = $('#hd', svg), hit = $('#hit', svg);
      function move(ev) {
        const box = svg.getBoundingClientRect();
        const sx = (ev.clientX - box.left) * W / box.width;
        const i = Math.max(0, Math.min(n - 1, Math.round((sx - m.l) / ((W - m.l - m.r) / Math.max(1, n - 1)))));
        xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.style.display = '';
        hd.innerHTML = picked.map(p => `<circle cx="${x(i)}" cy="${y(p.t.ranks[i])}" r="5" fill="${p.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
        tip.innerHTML = `<b>${esc(i ? weekName(labels[i]) : 'Preseason')}</b>` + picked.map(p =>
          `<div class="row"><span class="swatch" style="background:${p.color}"></span>${esc(p.t.name)}: #${p.t.ranks[i]}</div>`).join('');
        tip.style.display = 'block';
        const wb = wrap.getBoundingClientRect();
        let left = box.left - wb.left + x(i) * box.width / W + 14;
        if (left + tip.offsetWidth > wb.width - 8) left -= tip.offsetWidth + 28;
        tip.style.left = Math.max(8, left) + 'px';
        tip.style.top = (box.top - wb.top + 8) + 'px';
      }
      function leave() { xh.style.display = 'none'; hd.innerHTML = ''; tip.style.display = 'none'; }
      hit.addEventListener('pointermove', move);
      hit.addEventListener('pointerdown', move);
      hit.addEventListener('pointerleave', leave);
    }
    pa.addEventListener('change', draw); pb.addEventListener('change', draw);
    draw();
    if (window.ResizeObserver) new ResizeObserver(() => { if (Math.round(plot.clientWidth) !== lastW) draw(); }).observe(plot);
    return wrap;
  }

  // ------------------------------------------------------------ tabs
  const tabs = $('#tabs'), main = $('#main');
  sections.forEach(sec => {
    const b = document.createElement('button');
    b.type = 'button'; b.setAttribute('role', 'tab'); b.id = 'tab-' + sec.id; b.textContent = sec.tab;
    b.setAttribute('aria-controls', 'sec-' + sec.id);
    tabs.append(b);
    const el = document.createElement('section');
    el.id = 'sec-' + sec.id; el.setAttribute('role', 'tabpanel'); el.setAttribute('aria-labelledby', b.id); el.hidden = true;
    main.append(el);
    sec.btn = b; sec.el = el;
    b.addEventListener('click', () => show(sec.id, true));
  });
  function show(id, push) {
    const target = sections.find(s => s.id === id) || sections[0];
    sections.forEach(s => {
      const on = s === target;
      s.btn.setAttribute('aria-selected', on); s.btn.tabIndex = on ? 0 : -1; s.el.hidden = !on;
      if (on && !s.built) { s.build(s.el); s.built = true; }
      if (on) s.btn.scrollIntoView({block: 'nearest', inline: 'nearest'});
    });
    if (push) history.replaceState(null, '', '#' + target.id);
  }
  tabs.addEventListener('keydown', e => {
    const i = sections.findIndex(s => s.btn === document.activeElement);
    if (i < 0 || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const j = (i + (e.key === 'ArrowRight' ? 1 : sections.length - 1)) % sections.length;
    sections[j].btn.focus(); show(sections[j].id, true);
  });
  window.addEventListener('hashchange', () => show(location.hash.slice(1), false));
  show(location.hash.slice(1), false);
})();
</script>
</body>
</html>
